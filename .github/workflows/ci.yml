name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install MAUI Android dependencies
        run: dotnet build Nebula.App/Nebula.App/Nebula.App.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Restore (Nebula.slnx)
        run: dotnet restore Nebula.slnx

      - name: Build (Nebula.slnx)
        run: dotnet build Nebula.slnx --no-restore -v minimal

      - name: Test Agent
        run: dotnet test Nebula.Agent.Test/Nebula.Agent.Test.csproj --no-build -v minimal

      - name: Test App
        run: dotnet test Nebula.App.Test/Nebula.App.Test.csproj --no-build -v minimal

      - name: Validate docker compose
        run: docker compose config >/dev/null && echo "compose OK"
